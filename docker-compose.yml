services:
  mysql:
    image: mysql:8.0
    container_name: travel-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: travel_bishe
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: travel-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://root:root@mysql:3306/travel_bishe?charset=utf8mb4
      SECRET_KEY: ${SECRET_KEY:-docker-secret-change-me}
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
      FRONTEND_ORIGIN: http://localhost:8080
      # 可选：在项目根目录 .env 中配置，不配置时 AI 自动降级为关键词解析
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      DEEPSEEK_TIMEOUT: "20"
      AMAP_WEB_KEY: ${AMAP_WEB_KEY:-}
      RAG_EMBED_MODEL: ${RAG_EMBED_MODEL:-BAAI/bge-small-zh-v1.5}
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend/data:/app/data
      - ./backend/static/uploads:/app/static/uploads

  frontend:
    build: ./frontend
    container_name: travel-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mysql_data:
